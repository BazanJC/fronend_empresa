@if (loading()) {
<div class="fixed inset-0 z-[100] bg-surface flex items-center justify-center transition-opacity duration-700" [class.opacity-0]="isClosing()">
  
  <!-- Efecto de Partículas Elegante (Bokeh / Dust) -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="bokeh-particle particle-1"></div>
    <div class="bokeh-particle particle-2"></div>
    <div class="bokeh-particle particle-3"></div>
    <div class="bokeh-particle particle-4"></div>
    <div class="bokeh-particle particle-5"></div>
  </div>

  <div class="flex flex-col items-center relative z-10">
    <div class="preloader-logo-wrap">
      <h1 class="text-5xl font-bold tracking-tighter text-primary preloader-logo">[NOMBRE_EMPRESA]</h1>
      <div class="scan-line"></div>
    </div>
    <div class="mt-4 w-64 h-1 bg-on-surface/10 overflow-hidden rounded-full">
      <div class="h-full bg-primary-container transition-all duration-[3000ms] ease-out" [style.width]="progressWidth()"></div>
    </div>
    <p class="mt-4 text-[10px] tracking-[0.3em] opacity-40 uppercase animate-pulse">Iniciando sistemas</p>
  </div>
</div>
}

<router-outlet />
