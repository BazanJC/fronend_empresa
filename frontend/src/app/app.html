@if (loading()) {
  <div
    class="fixed inset-0 z-[100] bg-surface flex items-center justify-center preloader-overlay"
    [class.preloader-overlay--closing]="cerrando()">
    <div class="flex flex-col items-center preloader-content" [class.preloader-content--closing]="cerrando()">
  
      <!-- ===== ÁREA VISUAL: Proporcional al logo grande ===== -->
      <div class="preloader-visual" [class]="'phase-' + fase()">
  
        <!-- Partículas de energía nuclear -->
        <div class="particle-orbit orbit-1"><div class="particle"></div></div>
        <div class="particle-orbit orbit-2"><div class="particle"></div></div>
        <div class="particle-orbit orbit-3"><div class="particle"></div></div>
        <div class="particle-orbit orbit-4"><div class="particle"></div></div>
        <div class="particle-orbit orbit-5"><div class="particle particle-accent"></div></div>
        <div class="particle-orbit orbit-6"><div class="particle particle-accent"></div></div>
  
        <!-- Shockwave post-impacto -->
        <div class="shockwave-ring"></div>
        <div class="shockwave-ring delay-1"></div>
        <div class="shockwave-flash"></div>
  
        <!-- SVG: viewBox 600×600 para logo 300×300 + nodos con aire -->
        <svg viewBox="0 0 600 600" class="preloader-svg" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
          <defs>
            <filter id="preloader-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <linearGradient id="conn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:var(--color-brand-500);stop-opacity:0" />
              <stop offset="50%" style="stop-color:var(--color-accent-400);stop-opacity:0.9" />
              <stop offset="100%" style="stop-color:var(--color-brand-500);stop-opacity:0" />
            </linearGradient>
            <radialGradient id="impact-glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:var(--color-accent-400);stop-opacity:0.9" />
              <stop offset="40%" style="stop-color:var(--color-brand-500);stop-opacity:0.4" />
              <stop offset="100%" style="stop-color:var(--color-brand-500);stop-opacity:0" />
            </radialGradient>
            <!-- Fondo adaptativo del logo -->
            <filter id="logo-bg-blur" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="12"/>
            </filter>
          </defs>
  
          <!-- Aura de impacto SVG -->
          <circle cx="300" cy="300" r="0" class="impact-aura" fill="url(#impact-glow)" />
  
          <!-- Líneas de conexión (desde nodos hacia el centro del logo) -->
          <g class="connection-lines">
            <line x1="300" y1="80" x2="300" y2="210" class="conn-line conn-1" />
            <line x1="520" y1="300" x2="390" y2="300" class="conn-line conn-2" />
            <line x1="300" y1="520" x2="300" y2="390" class="conn-line conn-3" />
            <line x1="80" y1="300" x2="210" y2="300" class="conn-line conn-4" />
            <line x1="145" y1="145" x2="225" y2="225" class="conn-line conn-5" />
          </g>
  
          <!-- Nodos: 5 pilares — reescalados para viewBox 600 -->
          <g class="system-node node-1">
            <circle cx="300" cy="55" r="28" class="node-ring" />
            <circle cx="300" cy="55" r="22" class="node-fill" />
            <text x="300" y="62" text-anchor="middle" class="node-icon">🔒</text>
            <text x="300" y="22" text-anchor="middle" class="node-label">SEGURIDAD</text>
          </g>
  
          <g class="system-node node-2">
            <circle cx="545" cy="300" r="28" class="node-ring" />
            <circle cx="545" cy="300" r="22" class="node-fill" />
            <text x="545" y="307" text-anchor="middle" class="node-icon">⚡</text>
            <text x="545" y="350" text-anchor="middle" class="node-label">ENERGÍA</text>
          </g>
  
          <g class="system-node node-3">
            <circle cx="300" cy="545" r="28" class="node-ring" />
            <circle cx="300" cy="545" r="22" class="node-fill" />
            <text x="300" y="552" text-anchor="middle" class="node-icon">🌡️</text>
            <text x="300" y="595" text-anchor="middle" class="node-label">HVAC</text>
          </g>
  
          <g class="system-node node-4 node-highlight">
            <circle cx="55" cy="300" r="32" class="node-ring node-ring-accent" />
            <circle cx="55" cy="300" r="24" class="node-fill" />
            <text x="55" y="308" text-anchor="middle" class="node-icon">☢️</text>
            <text x="55" y="350" text-anchor="middle" class="node-label">RADIACIÓN</text>
          </g>
  
          <g class="system-node node-5">
            <circle cx="145" cy="145" r="28" class="node-ring" />
            <circle cx="145" cy="145" r="22" class="node-fill" />
            <text x="145" y="152" text-anchor="middle" class="node-icon">📋</text>
            <text x="145" y="112" text-anchor="middle" class="node-label">ISO</text>
          </g>
  
          <!-- Centro: Logo con fondo adaptativo + anillos nucleares -->
          <g class="logo-center">
            <!-- Anillos nucleares -->
            <circle cx="300" cy="300" r="90" class="nuclear-ring ring-1" />
            <circle cx="300" cy="300" r="78" class="nuclear-ring ring-2" />
            <circle cx="300" cy="300" r="68" class="nuclear-ring ring-3" />
  
            <!-- Fondo adaptativo del logo: blur + color del tema -->
            <circle cx="300" cy="300" r="165" class="logo-bg-circle" />
  
            <!-- Logo — AHORA SÍ VISIBLE EN AMBOS TEMAS -->
            <g class="preloader-logo-wrap">
              <image href="/logo-novaxis.png"
                     x="150" y="150" width="300" height="300"
                     class="preloader-logo-img"
                     preserveAspectRatio="xMidYMid meet" />
            </g>
  
            <!-- Scan line sobre el logo -->
            <rect x="148" y="148" width="304" height="4" rx="2" class="scan-line" />
          </g>
        </svg>
      </div>
  
      <!-- ===== BARRA DE PROGRESO ===== -->
      <div class="mt-8 w-80 max-w-[85vw] h-1.5 bg-on-surface/10 overflow-hidden rounded-full relative">
        <div class="h-full bg-primary-container transition-all duration-[2800ms] ease-out rounded-full"
             [style.width]="progressWidth()"></div>
      </div>
  
      <!-- ===== TEXTO DE FASE ===== -->
      <div class="mt-6 h-6 flex items-center justify-center">
        <p class="text-[11px] tracking-[0.3em] uppercase font-medium text-on-surface/40 phase-text"
           [class]="'phase-text-' + fase()">
          {{ textoFase() }}
        </p>
      </div>
  
      <!-- Indicadores de fase -->
      <div class="flex gap-2.5 mt-4">
        @for (i of [0,1,2,3,4]; track i) {
          <div class="w-2 h-2 rounded-full transition-all duration-500"
               [class.bg-primary-container]="fase() >= i"
               [class.bg-on-surface/15]="fase() < i"
               [class.scale-125]="fase() === i"
               [class.shadow-glow]="fase() === i"></div>
        }
      </div>
  
    </div>
  </div>
  }
  
  <app-header></app-header>
  <router-outlet />
  <app-footer></app-footer>
